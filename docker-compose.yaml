services:
  postgres:
    image: postgres:16-alpine
    container_name: secure-mcp-postgres
    environment:
      POSTGRES_PASSWORD: demopassword
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 2s
      timeout: 5s
      retries: 10
