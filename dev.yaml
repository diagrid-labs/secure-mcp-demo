version: 1

# The MCPServer resource in ./resources/postgresql-mcp.yaml registers this
# app with Diagrid so callers reach it via /v1.0/diagrid/mcp/postgresql-mcp.

common:
  resourcesPath: ./resources

apps:
  - appID: postgresql-mcp
    appDirPath: .
    appPort: 8001
    command: ["uv", "run", "python", "servers/postgresql_mcp.py"]
    # Also reads KEYCLOAK_PUBLIC_URL / KEYCLOAK_REALM / KEYCLOAK_AUDIENCE
    # (inherited from the launching shell — see DEMO.md's pre-demo steps).
    env:
      DB_USER_QUERY: mcp_db_query
      DB_PASSWORD_QUERY: query_pw
      DB_USER_WRITE: mcp_db_write
      DB_PASSWORD_WRITE: write_pw
      DB_USER_DELETE: mcp_db_delete
      DB_PASSWORD_DELETE: delete_pw
