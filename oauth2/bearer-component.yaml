apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bearer
spec:
  type: middleware.http.bearer
  version: v1
  metadata:
    - name: jwksURL
      value: "${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs"
    - name: issuer
      value: "${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}"
    - name: audience
      value: "${KEYCLOAK_AUDIENCE}"
scopes:
  - mcp-db-ddl
