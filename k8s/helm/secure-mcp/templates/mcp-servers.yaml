{{- /*
  Three Deployment+Service pairs for the per-op MCP servers. All three
  share one image; only `command`, `containerPort`, and DB credentials
  differ. Driven by values.mcpServer.servers.{query,write,delete}.
*/ -}}
{{- range $key, $srv := .Values.mcpServer.servers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $srv.appId }}
  labels:
    {{- include "secure-mcp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    secure-mcp/op: {{ $key }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Chart.Name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      secure-mcp/op: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Chart.Name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: mcp-server
        secure-mcp/op: {{ $key }}
      annotations:
        {{- include "secure-mcp.catalystAnnotations" (dict "appId" $srv.appId "port" $srv.port "Values" $.Values) | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ $.Values.mcpServer.image.repository }}:{{ $.Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ $.Values.mcpServer.image.pullPolicy }}
          command: {{ toJson $srv.command }}
          ports:
            - name: http
              containerPort: {{ $srv.port }}
          env:
            - name: DB_HOST
              value: {{ include "secure-mcp.pgHost" $ | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ $.Values.postgresql.auth.database | default "demo" | quote }}
            - name: DB_USER
              value: {{ $srv.dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $srv.dbPasswordSecret }}
                  key:  {{ $srv.dbPasswordKey }}
            - name: UI_BACKEND_URL
              value: "http://{{ $.Release.Name }}-ui:80"
          resources:
            {{- toYaml $.Values.mcpServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $srv.appId }}
  labels:
    {{- include "secure-mcp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    secure-mcp/op: {{ $key }}
spec:
  type: {{ $.Values.mcpServer.service.type }}
  selector:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    secure-mcp/op: {{ $key }}
  ports:
    - name: http
      port: {{ $srv.port }}
      targetPort: http
{{- end }}
