apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          env:
            # Catalyst — used by the `diagrid` CLI (control plane) and
            # by the data-plane invoke path. DAPR_HTTP_ENDPOINT is the
            # standard Dapr SDK env var; we read it in main.py instead of
            # shelling out for `diagrid project get` on every call.
            - name: DIAGRID_PROJECT
              value: {{ .Values.catalyst.project | quote }}
            {{- if .Values.catalyst.enabled }}
            - name: DIAGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalyst.apiKeySecret }}
                  key:  apiKey
            {{- end }}
            {{- if .Values.catalyst.httpEndpoint }}
            - name: DAPR_HTTP_ENDPOINT
              value: {{ .Values.catalyst.httpEndpoint | quote }}
            {{- end }}
            {{- if .Values.catalyst.grpcEndpoint }}
            - name: DAPR_GRPC_ENDPOINT
              value: {{ .Values.catalyst.grpcEndpoint | quote }}
            {{- end }}
            - name: ANALYST_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-mcp-client-tokens
                  key: analyst
                  optional: true
            - name: OPS_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-mcp-client-tokens
                  key: ops
                  optional: true
            - name: ADMIN_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-mcp-client-tokens
                  key: admin
                  optional: true
            - name: HAS_AGENT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: catalyst-mcp-client-tokens
                  key: present
                  optional: true

            # Catalyst's own OAuth2 client-credentials (Catalyst -> postgresql-mcp).
            # ui_backend's step-up toggle (POST /api/policy/apply) uses these
            # to configure/remove Catalyst's own OAuth2 auth on the MCPServer
            # resource — see oauth2/setup.sh and README.md's "OIDC / bearer
            # middleware". Must be Catalyst's cloud-reachable public URL, not
            # an in-cluster address. ui_backend also calls Keycloak directly
            # with these same values (POST /api/jwt-preview) to fetch an
            # illustrative JWT for display — never used for real auth, purely
            # to show the audience what one looks like.
            - name: KEYCLOAK_PUBLIC_URL
              value: "http://{{ .Values.ingress.host }}/keycloak"
            - name: KEYCLOAK_REALM
              value: {{ .Values.catalystProxyClient.realm | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.catalystProxyClient.audience | quote }}
            - name: CATALYST_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalystProxyClient.clientSecretRef.name }}
                  key:  {{ .Values.catalystProxyClient.clientSecretRef.key }}

            # UI backend reads employees directly from Postgres for the
            # Result panel's table; uses the superuser to bypass per-op
            # DB role grants (read-only access for the UI is fine).
            - name: DB_HOST
              value: {{ include "secure-mcp.pgHost" . | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | default "demo" | quote }}
            - name: UI_DB_USER
              value: "postgres"
            - name: UI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key:  postgres-password   # bitnami chart's default secret key
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-backend
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui-backend
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
