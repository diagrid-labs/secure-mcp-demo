{{- /*
  Demo-only Secrets. In a real deployment you'd let an external secret
  manager (Vault, ASO, External Secrets Operator) create these; for the
  demo we materialize them from values so `helm install` is one command.

  Override the demo defaults at install time:
    helm install ... --set-string mcpDbPasswords.query=...
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ (index .Values.mcpServer.servers "query").dbPasswordSecret }}
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  query:  {{ .Values.mcpDbPasswords.query  | default "query_pw"  | quote }}
  write:  {{ .Values.mcpDbPasswords.write  | default "write_pw"  | quote }}
  delete: {{ .Values.mcpDbPasswords.delete | default "delete_pw" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloakClient.clientSecretRef.name }}
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.keycloakClient.clientSecretRef.key }}: {{ .Values.keycloakClient.secret | default "mcp-agent-secret" | quote }}
